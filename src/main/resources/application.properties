spring.application.name=edps-backend
spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edps_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health

app.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}
app.ml.connect-timeout=${ML_CONNECT_TIMEOUT:2s}
app.ml.read-timeout=${ML_READ_TIMEOUT:5s}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}